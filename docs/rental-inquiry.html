<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Inquiry</title>
  <!--
    Rental inquiry form for the Property Management app (PM-12).

    BEFORE USING, replace every ALL_CAPS placeholder with the values from the
    form Salesforce generates in Setup > Web-to-Lead > Create Web-to-Lead Form:

      FORM_ACTION_URL          the full action="..." URL from the generated <form> tag
      YOUR_ORG_ID              the value of the hidden "oid" input
      YOUR_THANK_YOU_URL       where to send people after they submit (https://...)
      MOVE_IN_DATE_FIELD_ID    the name="00N..." of Desired Move-In Date
      HOUSEHOLD_SIZE_FIELD_ID  the name="00N..." of Household Size
      HAS_PETS_FIELD_ID        the name="00N..." of Has Pets
      PET_DETAILS_FIELD_ID     the name="00N..." of Pet Details
      CONTACT_METHOD_FIELD_ID  the name="00N..." of Preferred Contact Method

    Link to it with a channel campaign ID so the lead joins the right campaign:
      rental-inquiry.html?cid=701XXXXXXXXXXXXXXX&listing=Elm%20Avenue%20Duplex%20-%20Unit%20B
  -->
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #2b2a27;
      --muted: #6b6963;
      --border: #d9d6cd;
      --accent: #0f6e56;
      --accent-hover: #0b5543;
      --focus: rgba(15, 110, 86, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --card: #262624;
        --text: #ecebe6;
        --muted: #a8a69e;
        --border: #3d3c38;
        --accent: #3fb592;
        --accent-hover: #5cc9a8;
        --focus: rgba(63, 181, 146, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .intro { color: var(--muted); margin: 0 0 20px; }
    .listing {
      display: none;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin: 14px 0 4px; }
    .optional { font-weight: 400; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .check input { width: auto; }
    .check label { margin: 0; font-weight: 400; }
    #petDetailsWrap { display: none; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .fine { color: var(--muted); font-size: 0.8rem; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Rental inquiry</h1>
      <p class="intro">Tell us a little about yourself and we'll get back to you within one business day.</p>

      <div class="listing" id="listingBox">Inquiring about: <strong id="listingName"></strong></div>

      <form id="inquiryForm" action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dfj00000YpfqL" method="POST">
        <!-- Required by Web-to-Lead -->
        <input type="hidden" name="oid" value="00Dfj00000YpfqL">
        <input type="hidden" name="retURL" value="https://sudhakarsalesforce.github.io/property-management/thanks.html">

        <!-- Default source; a Flow replaces it with the campaign's channel when ?cid= is present -->
        <input type="hidden" name="lead_source" value="Website">

        <!-- Adds the new lead to the channel campaign passed in ?cid= -->
        <input type="hidden" name="Campaign_ID" id="campaignId">
        <input type="hidden" name="member_status" id="memberStatus" value="Inquired">

        <!-- While testing, uncomment these two lines to see a debug page instead of the redirect -->
        <!-- <input type="hidden" name="debug" value="1"> -->
        <!-- <input type="hidden" name="debugEmail" value="you@example.com"> -->

        <div class="row">
          <div>
            <label for="first_name">First name</label>
            <input id="first_name" name="first_name" maxlength="40" required autocomplete="given-name">
          </div>
          <div>
            <label for="last_name">Last name</label>
            <input id="last_name" name="last_name" maxlength="80" required autocomplete="family-name">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="80" required autocomplete="email">
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" maxlength="40" required autocomplete="tel">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="moveInPicker">Desired move-in date</label>
            <input id="moveInPicker" type="date" required>
            <!-- Salesforce expects the date in the lead creator's locale format (MM/DD/YYYY for US English) -->
            <input type="hidden" name="00Nfj00005Sx8rh" id="moveInValue">
          </div>
          <div>
            <label for="householdSize">People in household</label>
            <input id="householdSize" name="00Nfj00005Sx9PZ" type="number" min="1" max="20" required>
          </div>
        </div>

        <label for="contactMethod">Preferred contact method</label>
        <select id="contactMethod" name="00Nfj00005SxCDl" required>
          <option value="">Choose one</option>
          <option value="Email">Email</option>
          <option value="Phone">Phone</option>
          <option value="Text">Text</option>
        </select>

        <div class="check">
          <input type="checkbox" id="hasPets" name="00Nfj00005SxAQT" value="1">
          <label for="hasPets">I have pets</label>
        </div>

        <div id="petDetailsWrap">
          <label for="petDetails">Tell us about your pets</label>
          <input id="petDetails" name="00Nfj00005SxAQU" maxlength="255" placeholder="e.g. one 30 lb dog, spayed">
        </div>

        <label for="description">Questions or comments <span class="optional">(optional)</span></label>
        <textarea id="description" name="description" rows="4"></textarea>

        <button type="submit">Send inquiry</button>
        <p class="fine">We'll only use your information to respond to this inquiry.</p>
      </form>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var form = document.getElementById('inquiryForm');

      // Campaign: accept only a Salesforce-style ID; otherwise submit without a campaign.
      var cid = params.get('cid') || '';
      if (/^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$/.test(cid)) {
        document.getElementById('campaignId').value = cid;
      } else {
        document.getElementById('campaignId').remove();
        document.getElementById('memberStatus').remove();
      }

      // Listing name is display-only, so set it as text, never as HTML.
      var listing = params.get('listing');
      if (listing) {
        document.getElementById('listingName').textContent = listing;
        document.getElementById('listingBox').style.display = 'block';
      }

      // Show the pet details box only when "I have pets" is checked.
      var hasPets = document.getElementById('hasPets');
      var petWrap = document.getElementById('petDetailsWrap');
      hasPets.addEventListener('change', function () {
        petWrap.style.display = hasPets.checked ? 'block' : 'none';
      });

      // Convert the browser's YYYY-MM-DD date into MM/DD/YYYY for Salesforce.
      form.addEventListener('submit', function () {
        var picked = document.getElementById('moveInPicker').value;
        if (picked) {
          var parts = picked.split('-');
          document.getElementById('moveInValue').value = parts[1] + '/' + parts[2] + '/' + parts[0];
        }
      });
    })();
  </script>
</body>
</html>
